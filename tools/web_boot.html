<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title>{{EXTRA_HEAD}}<style>
body{margin:0;background:#081018;color:#f4f7fa;font-family:Arial,sans-serif}#webBoot{padding:90px 16px 24px;max-width:940px;margin:auto}#webBoot .boot-bar{position:fixed;inset:0 0 auto;z-index:1000;display:flex;align-items:center;gap:12px;background:#132532;border-bottom:2px solid #7e4248;padding:8px max(12px,calc((100vw - 960px)/2));min-height:46px}#webBoot button{font:inherit;min-height:44px;border-radius:10px;padding:10px 18px;color:white;border:1px solid #365466;background:#1c3748;cursor:pointer}#webBoot #webBootStop{background:#e74c3c;font-size:24px;font-weight:bold;min-width:100px;border:0}#webBoot h1{font-size:24px;overflow-wrap:anywhere}#webBoot .boot-card{padding:18px;border:1px solid #2b4557;border-radius:12px;background:#111d28}#webBoot .boot-angles{display:flex;gap:32px;flex-wrap:wrap}#webBoot b{font-size:26px}#webBoot p{line-height:1.5}#webBoot a{color:#b9e5ff}#webBootRetry[hidden]{display:none}
</style></head><body><div id="webBoot"><div class="boot-bar"><button id="webBootStop" type="button">STOP</button><span id="webBootState" role="status">Проверяем состояние…</span></div><h1 id="webBootName">{{TITLE}}</h1><div class="boot-card"><div class="boot-angles"><div>AZ <b id="webBootaz">—</b></div><div>EL <b id="webBootel">—</b></div></div><p id="webBootMessage" role="status">Загружаем интерфейс…</p><button id="webBootRetry" type="button" hidden>Повторить загрузку</button></div><p><a href="/recovery">Оборудование и восстановление</a></p><noscript>Для управления включите JavaScript в браузере.</noscript></div><script>{{BOOT_SCRIPT}}</script></body></html>
