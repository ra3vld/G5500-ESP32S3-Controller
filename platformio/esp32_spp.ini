; Classic ESP32: Wi-Fi, essential web, GS-232/SPP, rotctld, N1MM and PstRotator.
; Build with tools/build_esp32_spp.py for an isolated optimized Arduino SDK.
[esp32_spp]
build_flags =
    ${env:esp32_4mb.build_flags}
    -D ESP32_SPP_PROFILE=1
    -D BLUETOOTH_ENABLED=1
    -D BLUETOOTH_MODE=BT_ESP32_SPP
    -D MQTT_SUPPORT=0
    -D HOME_ASSISTANT_DISCOVERY_SUPPORT=0
    -D WEB_LIVE_SUPPORT=0
    -D HUD_UART_SUPPORT=0
    -D N1MM_SUPPORT=1
    -D PSTROTATOR_SUPPORT=1
    -D ROTCTLD_SUPPORT=1
    -D RS485_SUPPORT=0
    -D MODBUS_RTU_SUPPORT=0
    -D DISPLAY_SUPPORT=0
    -D LOCAL_INPUT_SUPPORT=0
    -D RSSI_HISTORY_SUPPORT=0
    -D NTP_SUPPORT=0
    -D COMMAND_API_SUPPORT=0
    -D LOG_HISTORY_SUPPORT=0
    -D RESET_HISTORY_SUPPORT=0
    -D OTA_SUPPORT=0
    -D ARDUINO_OTA_SUPPORT=0
build_src_filter = +<*> -<motion.cpp> -<src/ruckig/>
custom_sdkconfig =
    CONFIG_BT_ENABLED=y
    CONFIG_BT_BLUEDROID_ENABLED=y
    CONFIG_BT_CLASSIC_ENABLED=y
    CONFIG_BT_SPP_ENABLED=y
    CONFIG_BLE_MESH=n
    CONFIG_BT_BLE_ENABLED=n
    CONFIG_BT_A2DP_ENABLE=n
    CONFIG_BT_HFP_ENABLE=n
    CONFIG_BT_BTC_TASK_STACK_SIZE=4096
    CONFIG_BT_BTU_TASK_STACK_SIZE=4352
    CONFIG_BTDM_CTRL_MODE_BTDM=n
    CONFIG_BTDM_CTRL_MODE_BLE_ONLY=n
    CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY=y
    CONFIG_BTDM_CTRL_BR_EDR_MAX_ACL_CONN=1
    CONFIG_BTDM_CTRL_BR_EDR_MAX_SYNC_CONN=0
    CONFIG_BT_ACL_CONNECTIONS=2

[env:esp32_spp]
extends = env:esp32_4mb
build_src_filter = ${esp32_spp.build_src_filter}
build_flags =
    ${esp32_spp.build_flags}
    -D HUD_SUPPORT=0
    -D HUD_UDP_SUPPORT=0
custom_sdkconfig = ${esp32_spp.custom_sdkconfig}

[env:esp32_spp_hud]
extends = env:esp32_spp
build_flags =
    ${esp32_spp.build_flags}
    -D HUD_SUPPORT=1
    -D HUD_UDP_SUPPORT=1
