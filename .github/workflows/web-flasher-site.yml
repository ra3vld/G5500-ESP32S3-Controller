name: Publish web flasher website

on:
  push:
    branches: [main]
    paths:
      - 'web-flasher/index.html'
      - 'web-flasher/app.js'
      - 'web-flasher/provisioning.js'
      - 'web-flasher/serial-api.js'
      - 'web-flasher/style.css'
      - 'web-flasher/images/favicon.svg'
      - 'tools/update_web_flasher_site.py'
      - 'tools/patch_web_flasher_vendor.mjs'
      - 'tools/build_web_flasher_docs.py'
      - 'docs/**'
      - 'README.md'
      - 'tools/package_web_release.py'
      - 'tools/check_preconfiguration.cjs'
      - 'tools/check_web_flasher_catalog.py'
      - 'tools/check_web_flasher.cjs'
      - 'tests/test_update_web_flasher_site.py'
      - 'tests/test_split_web_release.py'
      - '.github/workflows/web-flasher-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-flasher-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 -m pip install Markdown==3.5.2
      - run: python3 -m unittest discover -s tests -p test_update_web_flasher_site.py
      - run: python3 -m unittest discover -s tests -p test_split_web_release.py
      - id: release
        name: Download the latest stable release website
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          RELEASE_TAG=$(gh release view --json tagName --jq .tagName)
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("A published stable release is required") else . end'
          mkdir -p artifacts/release-files
          gh release download "$RELEASE_TAG" --pattern web-flasher-site.zip --pattern release-manifest.json --pattern SHA256SUMS --dir artifacts/release-files
          if python3 -c 'import json,sys; sys.exit(json.load(open("artifacts/release-files/release-manifest.json")).get("schema") != 2)'; then
            gh release download "$RELEASE_TAG" --pattern 'firmware-*.zip' --pattern source-code.zip --dir artifacts/release-files
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Update UI and verify unchanged released firmware
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python3 tools/update_web_flasher_site.py --archive artifacts/release-files/web-flasher-site.zip --checksums artifacts/release-files/SHA256SUMS --tag "$RELEASE_TAG"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web-flasher
      - run: npm run test:preconfiguration
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web-flasher
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prevent publishing an older firmware catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          CURRENT_TAG=$(gh release view --json tagName --jq .tagName)
          if [ "$CURRENT_TAG" != "$RELEASE_TAG" ]; then
            echo 'The latest firmware release changed; rerun this website workflow.' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
