[platformio]
src_dir = G5500_Fork
default_envs = esp32s3_n16r8

[env:esp32s3_n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = G5500_Fork/partitions.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit GFX Library @ 1.12.1
    adafruit/Adafruit ILI9341 @ 1.6.2
    adafruit/Adafruit BusIO @ 1.17.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/tags/v1.4.zip

[env:esp32s2_4mb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s2-saola-1
framework = arduino
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = G5500_Fork/partitions_s2.csv
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit GFX Library @ 1.12.1
    adafruit/Adafruit ILI9341 @ 1.6.2
    adafruit/Adafruit BusIO @ 1.17.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/tags/v1.4.zip
