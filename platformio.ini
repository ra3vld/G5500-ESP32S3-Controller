[platformio]
src_dir = G5500_Fork
default_envs = esp32s3_n16r8

[env]
extra_scripts = pre:tools/platformio_version.py

[env:esp32_4mb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
board_build.partitions = G5500_Fork/partitions_esp32.csv
build_flags =
    -D BOARD_PROFILE=BOARD_ESP32
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
lib_ldf_mode = chain+

[env:esp32_4mb_lcd]
extends = env:esp32_4mb
build_flags =
    ${env:esp32_4mb.build_flags}
    -D DISPLAY_KIND=DISPLAY_LCD1602
    -D TFT_DISPLAY_ENABLED=0
lib_deps =
    ${env:esp32_4mb.lib_deps}
    arduino-libraries/LiquidCrystal @ 1.0.7

[graphics]
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I G5500_Fork
lib_deps = lvgl/lvgl @ 9.6.0

[env:esp32_3248s035c]
extends = env:esp32_4mb
board_upload.maximum_size = 3145728
extra_scripts =
    ${env.extra_scripts}
    post:tools/platformio_lto.py
    post:tools/platformio_image_size.py
build_flags =
    -flto
    -D BOARD_PROFILE=BOARD_ESP32_3248S035C
    -D DISPLAY_KIND=DISPLAY_ST7796
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ${graphics.build_flags}
lib_deps = ${graphics.lib_deps}
lib_ldf_mode = chain

[env:esp32_2424s012c]
extends = env:esp32_4mb
board = esp32-c3-devkitm-1
board_upload.maximum_size = 3145728
board_build.partitions = G5500_Fork/partitions_esp32.csv
extra_scripts =
    ${env.extra_scripts}
    post:tools/platformio_lto.py
    post:tools/platformio_image_size.py
build_flags =
    -flto
    -D BOARD_PROFILE=BOARD_ESP32_2424S012C
    -D DISPLAY_KIND=DISPLAY_GC9A01
    ${graphics.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${graphics.lib_deps}
    adafruit/Adafruit GC9A01A @ 1.1.0
    adafruit/Adafruit GFX Library @ 1.12.1
    adafruit/Adafruit BusIO @ 1.17.2
lib_ldf_mode = chain

[env:esp32c3_4mb]
extends = env:esp32_4mb
board = esp32-c3-devkitm-1
board_upload.maximum_size = 3145728
board_build.partitions = G5500_Fork/partitions_esp32.csv
extra_scripts =
    ${env.extra_scripts}
    post:tools/platformio_lto.py
build_flags =
    -flto
    -D BOARD_PROFILE=BOARD_ESP32_C3
    -D DISPLAY_KIND=DISPLAY_NONE
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =

[env:esp32_4mb_noweb]
extends = env:esp32_4mb
board_build.partitions = G5500_Fork/partitions_s2.csv
build_flags =
    ${env:esp32_4mb.build_flags}
    -D WEB_INTERFACE_ENABLED=0
    -D BLUETOOTH_SUPPORT=0
    -D BLUETOOTH_ENABLED=0
    -D DISPLAY_KIND=DISPLAY_NONE

[env:esp32_8mb_ota]
extends = env:esp32_4mb
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = G5500_Fork/partitions_esp32_8mb.csv

[env:esp32_4mb_ota]
extends = env:esp32_4mb
board_build.partitions = G5500_Fork/partitions_s2.csv

[env:esp32_4mb_tft]
lib_ldf_mode = chain
extends = env:esp32_4mb
board_upload.maximum_size = 3145728
extra_scripts =
    ${env.extra_scripts}
    post:tools/platformio_lto.py
    post:tools/platformio_image_size.py
build_flags =
    ${env:esp32_4mb.build_flags}
    -flto
    -D DISPLAY_KIND=DISPLAY_ILI9341
    -D TFT_DISPLAY_ENABLED=1
    ${graphics.build_flags}
lib_deps =
    ${env:esp32_4mb.lib_deps}
    ${display_tft.lib_deps}

[env:esp32s3_n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = G5500_Fork/partitions_s3.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D BOARD_PROFILE=BOARD_S3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =

[env:esp32s3_n16r8_headless]
extends = env:esp32s3_n16r8
build_flags =
    ${env:esp32s3_n16r8.build_flags}
    -D TFT_DISPLAY_ENABLED=0
lib_deps =
lib_ldf_mode = chain+

[env:waveshare_esp32s3_eth]
extends = env:esp32s3_n16r8
board_build.flash_size = 16MB
lib_ldf_mode = deep
build_flags =
    -D BOARD_HAS_PSRAM
    -D BOARD_PROFILE=BOARD_WAVESHARE_S3_ETH
    -D DRIVE_INTERFACE=DRIVE_BTS7960
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:waveshare_esp32s3_eth_nocam]
extends = env:waveshare_esp32s3_eth
build_flags =
    ${env:waveshare_esp32s3_eth.build_flags}
    -D CAMERA_ENABLED=0

[env:crowpanel_21]
extra_scripts =
    ${env.extra_scripts}
    post:tools/platformio_image_size.py
extends = env:esp32s3_n16r8
board_build.flash_size = 16MB
build_flags =
    -D BOARD_HAS_PSRAM
    -D BOARD_PROFILE=BOARD_CROWPANEL_21
    -D DISPLAY_KIND=DISPLAY_CROWPANEL_21
    -D BLUETOOTH_ENABLED=0
    -D USER_BUTTON_GPIO=-1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I G5500_Fork
lib_deps = lvgl/lvgl @ 9.6.0
lib_ldf_mode = chain

[env:crowpanel_21_trace]
extends = env:crowpanel_21
build_flags =
    ${env:crowpanel_21.build_flags}
    -D CROWPANEL_USB_TRACE=1

[env:crowpanel_21_az]
extends = env:crowpanel_21
build_flags =
    ${env:crowpanel_21.build_flags}
    -D CROWPANEL_LOCAL_DRIVE=1
    -D DRIVE_SIMULATION=0

[env:esp32s2_4mb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
extra_scripts =
    ${env.extra_scripts}
    post:tools/platformio_lto.py
board = esp32-s2-saola-1
framework = arduino
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = G5500_Fork/partitions_s2.csv
build_flags =
    -flto
    -D BOARD_PROFILE=BOARD_S2_LEGACY
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =

[env:esp32s2_4mb_headless]
extends = env:esp32s2_4mb
build_flags =
    ${env:esp32s2_4mb.build_flags}
    -D TFT_DISPLAY_ENABLED=0
lib_deps =
lib_ldf_mode = chain+

[env:esp32s2_mini]
extends = env:esp32s2_4mb
board = lolin_s2_mini
board_build.flash_mode = dio
board_upload.maximum_size = 3145728
board_build.partitions = G5500_Fork/partitions_esp32.csv
build_flags =
    -flto
    -D BOARD_PROFILE=BOARD_S2_MINI
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env:esp32s2_4mb.lib_deps}

[env:esp32s3_n16r8_lcd]
extends = env:esp32s3_n16r8
build_flags =
    ${env:esp32s3_n16r8.build_flags}
    -D DISPLAY_KIND=DISPLAY_LCD1602
    -D TFT_DISPLAY_ENABLED=0
lib_deps = arduino-libraries/LiquidCrystal @ 1.0.7

[env:esp32s2_mini_lcd]
extends = env:esp32s2_mini
build_flags =
    ${env:esp32s2_mini.build_flags}
    -D DISPLAY_KIND=DISPLAY_LCD1602
    -D TFT_DISPLAY_ENABLED=0
lib_deps = arduino-libraries/LiquidCrystal @ 1.0.7

[env:esp32s2_mini_headless]
extends = env:esp32s2_mini
lib_deps =
lib_ldf_mode = chain+

[display_tft]
lib_deps =
    ${graphics.lib_deps}
    adafruit/Adafruit GFX Library @ 1.12.1
    adafruit/Adafruit ILI9341 @ 1.6.2
    adafruit/Adafruit BusIO @ 1.17.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/tags/v1.4.zip

[env:esp32s3_n16r8_tft]
extra_scripts =
    ${env.extra_scripts}
    post:tools/platformio_image_size.py
lib_ldf_mode = chain
extends = env:esp32s3_n16r8
build_flags =
    ${env:esp32s3_n16r8.build_flags}
    -D DISPLAY_KIND=DISPLAY_ILI9341
    -D TFT_DISPLAY_ENABLED=1
    ${graphics.build_flags}
lib_deps = ${display_tft.lib_deps}

[env:esp32s2_mini_tft]
extra_scripts =
    ${env.extra_scripts}
    post:tools/platformio_lto.py
    post:tools/platformio_image_size.py
lib_ldf_mode = chain
extends = env:esp32s2_mini
build_flags =
    ${env:esp32s2_mini.build_flags}
    -D DISPLAY_KIND=DISPLAY_ILI9341
    -D TFT_DISPLAY_ENABLED=1
    ${graphics.build_flags}
lib_deps = ${display_tft.lib_deps}

[env:wt32_eth01]
extends = env:esp32_4mb
board = wt32-eth01
board_upload.maximum_size = 3145728
lib_ldf_mode = deep
build_flags =
    -D BOARD_PROFILE=BOARD_WT32_ETH01
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

[env:wt32_eth01_noweb]
extends = env:wt32_eth01
board_upload.maximum_size = 1966080
board_build.partitions = G5500_Fork/partitions_s2.csv
build_flags =
    ${env:wt32_eth01.build_flags}
    -D WEB_INTERFACE_ENABLED=0
    -D BLUETOOTH_SUPPORT=0
    -D BLUETOOTH_ENABLED=0
    -D DISPLAY_KIND=DISPLAY_NONE
