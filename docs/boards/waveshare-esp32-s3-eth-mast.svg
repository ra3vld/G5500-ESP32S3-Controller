<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400">
<rect width="2000" height="1400" fill="white"/>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#18344c"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#1476a5"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#27815a"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#8057a6"/></marker><marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9" fill="#bf6418"/></marker></defs>
<g font-family="DejaVu Sans,sans-serif">
<text x="50" y="65" font-size="38" font-weight="700" fill="#18344c">Контроллер поворотки рядом с антеннами</text>
<text x="50" y="108" font-size="23" font-weight="400" fill="#18344c">Короткие провода к двигателям и датчикам; вниз по мачте идут питание и связь.</text>
<text x="50" y="1365" font-size="21" font-weight="400" fill="#61788a">Waveshare ESP32-S3-ETH  |  AZ / EL  |  камера на мачте</text>
<text x="1820" y="1365" font-size="21" font-weight="400" fill="#61788a">1 / 2</text>
<rect x="40" y="145" width="1920" height="770" rx="14" fill="#f8fbfd" stroke="#a6b9c8" stroke-width="2"/>
<text x="70" y="190" font-size="27" font-weight="700" fill="#18344c">НА МАЧТЕ</text>
<path d="M260,250 L260,850" fill="none" stroke="#18344c" stroke-width="12" stroke-linejoin="round"/>
<path d="M80,260 L290,260" fill="none" stroke="#18344c" stroke-width="7" stroke-linejoin="round"/>
<path d="M95,215 L95,305" fill="none" stroke="#18344c" stroke-width="5" stroke-linejoin="round"/>
<path d="M145,195 L145,325" fill="none" stroke="#18344c" stroke-width="5" stroke-linejoin="round"/>
<path d="M200,175 L200,345" fill="none" stroke="#18344c" stroke-width="5" stroke-linejoin="round"/>
<path d="M260,155 L260,365" fill="none" stroke="#18344c" stroke-width="5" stroke-linejoin="round"/>
<text x="70" y="410" font-size="26" font-weight="700" fill="#18344c">Антенны</text>
<text x="70" y="448" font-size="24" font-weight="400" fill="#18344c">и поворотка</text>
<text x="70" y="790" font-size="24" font-weight="400" fill="#18344c">Мачта</text>
<text x="70" y="827" font-size="21" font-weight="400" fill="#18344c">Металл → PE</text>
<rect x="360" y="190" width="1160" height="685" rx="14" fill="#eef4f8" stroke="#1476a5" stroke-width="2"/>
<text x="390" y="232" font-size="26" font-weight="700" fill="#18344c">УЛИЧНЫЙ КОРПУС ОКОЛО ПОВОРОТКИ</text>
<rect x="420" y="265" width="430" height="280" rx="14" fill="#e0f0fa" stroke="#1476a5" stroke-width="2"/>
<text x="448" y="310" font-size="32" font-weight="700" fill="#18344c">Waveshare</text>
<text x="448" y="350" font-size="32" font-weight="700" fill="#18344c">ESP32-S3-ETH</text>
<text x="448" y="402" font-size="24" font-weight="400" fill="#1476a5">W5500 / RJ45</text>
<text x="448" y="444" font-size="21" font-weight="400" fill="#18344c">Камера + 4 PWM + общая I²C</text>
<text x="448" y="487" font-size="24" font-weight="400" fill="#18344c">Управление AZ / EL</text>
<text x="448" y="523" font-size="21" font-weight="400" fill="#18344c">microSD не устанавливать</text>
<rect x="1080" y="265" width="360" height="125" rx="14" fill="#e8f5ed" stroke="#27815a" stroke-width="2"/>
<text x="1105" y="308" font-size="26" font-weight="700" fill="#18344c">BTS7960 / IBT-2 · AZ</text>
<text x="1105" y="347" font-size="21" font-weight="400" fill="#18344c">RPWM + LPWM + ENABLE</text>
<text x="1105" y="376" font-size="20" font-weight="400" fill="#18344c">Своя силовая ветвь +U / 0V</text>
<rect x="1640" y="265" width="290" height="105" rx="14" fill="#e8f5ed" stroke="#27815a" stroke-width="2"/>
<text x="1665" y="308" font-size="27" font-weight="700" fill="#18344c">Двигатель AZ</text>
<text x="1665" y="345" font-size="23" font-weight="400" fill="#18344c">M+ / M−</text>
<path d="M1440,320 L1640,320" fill="none" stroke="#27815a" stroke-width="6" stroke-linejoin="round" marker-end="url(#a2)"/>
<text x="1460" y="302" font-size="19" font-weight="400" fill="#27815a">2 провода</text>
<rect x="1640" y="395" width="290" height="100" rx="14" fill="#f1eaf7" stroke="#8057a6" stroke-width="2"/>
<text x="1665" y="433" font-size="26" font-weight="700" fill="#18344c">Датчик AZ</text>
<text x="1665" y="470" font-size="22" font-weight="400" fill="#18344c">MT6701 · 0x06</text>
<rect x="1080" y="515" width="360" height="125" rx="14" fill="#e8f5ed" stroke="#27815a" stroke-width="2"/>
<text x="1105" y="558" font-size="26" font-weight="700" fill="#18344c">BTS7960 / IBT-2 · EL</text>
<text x="1105" y="597" font-size="21" font-weight="400" fill="#18344c">RPWM + LPWM + ENABLE</text>
<text x="1105" y="626" font-size="20" font-weight="400" fill="#18344c">Своя силовая ветвь +U / 0V</text>
<rect x="1640" y="515" width="290" height="105" rx="14" fill="#e8f5ed" stroke="#27815a" stroke-width="2"/>
<text x="1665" y="558" font-size="27" font-weight="700" fill="#18344c">Двигатель EL</text>
<text x="1665" y="595" font-size="23" font-weight="400" fill="#18344c">M+ / M−</text>
<path d="M1440,570 L1640,570" fill="none" stroke="#27815a" stroke-width="6" stroke-linejoin="round" marker-end="url(#a2)"/>
<text x="1460" y="552" font-size="19" font-weight="400" fill="#27815a">2 провода</text>
<rect x="1640" y="645" width="290" height="100" rx="14" fill="#f1eaf7" stroke="#8057a6" stroke-width="2"/>
<text x="1665" y="683" font-size="26" font-weight="700" fill="#18344c">Датчик EL</text>
<text x="1665" y="720" font-size="22" font-weight="400" fill="#18344c">MT6701 · 0x46</text>
<path d="M850,330 L1080,330" fill="none" stroke="#27815a" stroke-width="4" stroke-linejoin="round" marker-end="url(#a2)"/>
<text x="879" y="310" font-size="21" font-weight="400" fill="#27815a">AZ · 3 сигнала</text>
<path d="M850,470 L1040,470 L1040,575 L1080,575" fill="none" stroke="#27815a" stroke-width="4" stroke-linejoin="round" marker-end="url(#a2)"/>
<text x="870" y="450" font-size="21" font-weight="400" fill="#27815a">EL · 3 сигнала</text>
<rect x="420" y="595" width="230" height="105" rx="14" fill="#e0f0fa" stroke="#1476a5" stroke-width="2"/>
<text x="443" y="635" font-size="27" font-weight="700" fill="#18344c">Камера DVP</text>
<text x="443" y="675" font-size="20" font-weight="400" fill="#18344c">За окном корпуса</text>
<path d="M535,595 L535,545" fill="none" stroke="#1476a5" stroke-width="4" stroke-linejoin="round" marker-end="url(#a1)"/>
<text x="552" y="577" font-size="19" font-weight="400" fill="#1476a5">Короткий FFC</text>
<rect x="700" y="625" width="280" height="95" rx="14" fill="#fff2df" stroke="#bf6418" stroke-width="2"/>
<text x="722" y="664" font-size="25" font-weight="700" fill="#18344c">DC/DC +U → 5 В</text>
<text x="722" y="701" font-size="20" font-weight="400" fill="#18344c">Плата и камера</text>
<path d="M770,625 L770,545" fill="none" stroke="#bf6418" stroke-width="4" stroke-linejoin="round" marker-end="url(#a4)"/>
<text x="786" y="589" font-size="21" font-weight="400" fill="#bf6418">5 В</text>
<rect x="1120" y="730" width="320" height="95" rx="14" fill="#f1eaf7" stroke="#8057a6" stroke-width="2"/>
<text x="1143" y="767" font-size="24" font-weight="700" fill="#18344c">Одна шина I²C</text>
<text x="1143" y="802" font-size="20" font-weight="400" fill="#18344c">SDA: GPIO4 · SCL: GPIO5</text>
<path d="M1640,445 L1560,445 L1560,775 L1440,775" fill="none" stroke="#8057a6" stroke-width="5" stroke-linejoin="round"/>
<path d="M1640,695 L1560,695" fill="none" stroke="#8057a6" stroke-width="5" stroke-linejoin="round"/>
<circle cx="1560" cy="695" r="5" fill="#8057a6"/>
<text x="1590" y="824" font-size="21" font-weight="400" fill="#8057a6">3V3, GND, SDA, SCL</text>
<path d="M1120,775 L1000,775 L1000,530 L850,530" fill="none" stroke="#8057a6" stroke-width="4" stroke-linejoin="round" marker-end="url(#a3)"/>
<text x="1018" y="704" font-size="21" font-weight="400" fill="#8057a6">AZ / EL</text>
<rect x="420" y="745" width="300" height="95" rx="14" fill="#f1eaf7" stroke="#8057a6" stroke-width="2" stroke-dasharray="12 8"/>
<text x="442" y="781" font-size="24" font-weight="700" fill="#18344c">RS-485 с развязкой</text>
<text x="442" y="816" font-size="19" font-weight="400" fill="#18344c">Вариант вместо USB / RGB</text>
<path d="M420,495 L390,495 L390,790 L420,790" fill="none" stroke="#8057a6" stroke-width="4" stroke-linejoin="round" marker-end="url(#a3)" stroke-dasharray="12 7"/>
<rect x="40" y="1060" width="1920" height="255" rx="14" fill="#f6f7f8" stroke="#a6b9c8" stroke-width="2"/>
<text x="65" y="1095" font-size="23" font-weight="700" fill="#18344c">В ПОМЕЩЕНИИ</text>
<path d="M420,385 L320,385 L320,1110" fill="none" stroke="#1476a5" stroke-width="6" stroke-linejoin="round"/>
<text x="62" y="956" font-size="25" font-weight="700" fill="#1476a5">Ethernet</text>
<text x="62" y="992" font-size="22" font-weight="400" fill="#1476a5">Камера + команды</text>
<path d="M550,840 L550,1020 L900,1020 L900,1110" fill="none" stroke="#8057a6" stroke-width="5" stroke-linejoin="round" stroke-dasharray="12 7"/>
<text x="620" y="956" font-size="25" font-weight="700" fill="#8057a6">RS-485 · A / B + COM</text>
<text x="620" y="992" font-size="22" font-weight="400" fill="#8057a6">Команды и телеметрия</text>
<path d="M840,720 L840,895 L1270,895 L1270,1020 L1620,1020 L1620,1110" fill="none" stroke="#bf6418" stroke-width="6" stroke-linejoin="round"/>
<text x="1370" y="956" font-size="25" font-weight="700" fill="#bf6418">Питание +U / 0V</text>
<text x="1370" y="992" font-size="22" font-weight="400" fill="#bf6418">Напряжение по двигателям</text>
<rect x="70" y="1110" width="500" height="175" rx="14" fill="#ffffff" stroke="#1476a5" stroke-width="2"/>
<text x="93" y="1148" font-size="27" font-weight="700" fill="#1476a5">Коммутатор / роутер</text>
<text x="93" y="1187" font-size="22" font-weight="400" fill="#18344c">ПК: веб и изображение</text>
<text x="93" y="1221" font-size="22" font-weight="400" fill="#18344c">HUD по сети / Wi-Fi</text>
<text x="93" y="1255" font-size="22" font-weight="400" fill="#18344c">Ethernet не требует RS-485</text>
<rect x="650" y="1110" width="600" height="175" rx="14" fill="#ffffff" stroke="#8057a6" stroke-width="2"/>
<text x="673" y="1148" font-size="27" font-weight="700" fill="#8057a6">Один из вариантов RS-485</text>
<text x="673" y="1187" font-size="22" font-weight="400" fill="#18344c">HUD с RS-485</text>
<text x="673" y="1221" font-size="22" font-weight="400" fill="#18344c">ПК через USB ↔ RS-485</text>
<text x="673" y="1255" font-size="22" font-weight="400" fill="#18344c">Либо шлюз Ethernet ↔ RS-485</text>
<rect x="1370" y="1110" width="550" height="175" rx="14" fill="#ffffff" stroke="#bf6418" stroke-width="2"/>
<text x="1393" y="1148" font-size="27" font-weight="700" fill="#bf6418">Источник питания +U</text>
<text x="1393" y="1187" font-size="22" font-weight="400" fill="#18344c">Отдельные предохранители AZ / EL</text>
<text x="1393" y="1221" font-size="22" font-weight="400" fill="#18344c">5 В формируются наверху в DC/DC</text>
<text x="1393" y="1255" font-size="22" font-weight="400" fill="#18344c">Силовой ток не идёт через ESP32</text>
</g></svg>