<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2121" viewBox="0 0 3000 2121">
<rect width="100%" height="100%" fill="white"/>
<text x="70" y="80" font-family="DejaVu Sans,sans-serif" font-size="46" fill="#172535" font-weight="700">G-800SA: команды RIGHT / LEFT и подключение ESP32</text>
<text x="70" y="132" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#172535" font-weight="400">Два сухих нормально разомкнутых контакта подключаются параллельно штатным кнопкам.</text>
<text x="2820" y="80" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#172535" font-weight="400">3/3</text>
<rect x="70" y="165" width="2860" height="90" rx="10" fill="#edf5ff" stroke="#9bbbe0" stroke-width="2"/>
<text x="95" y="204" font-family="DejaVu Sans,sans-serif" font-size="30" fill="#172535" font-weight="700">K1/K2: реле 5 В с контактом COM/NO. Q1/Q2: BC337-40. На GPIO подаётся только логика 3,3 В.</text>
<text x="95" y="240" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#172535" font-weight="400">Не подавать напряжение из ESP32 на контакты S2/S3. Используются только изолированные контакты реле.</text>
