<text x="100" y="1895" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#172535" font-weight="400">Модель G-800DXA (одна AZ), привод YAESU, физический режим; EL не подключать. Без скорости: флажок 0–5 В выключен.</text>
<polyline points="70,2020 2930,2020" fill="none" stroke="#b4c8d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="2063" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#172535" font-weight="400">Для K1/K2 подходят SRD-05VDC-SL-C; используйте распиновку своего реле. NC свободен. Питание ESP/катушек: стабилизированные 5 В.</text>
<text x="70" y="2100" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#526779" font-weight="400">G-800SA • Штатные кнопки, реле реверса, концевики и кабель ротатора сохраняются.</text>
