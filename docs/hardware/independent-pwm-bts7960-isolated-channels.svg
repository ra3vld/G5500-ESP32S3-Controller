<text x="1618" y="1187.0" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="normal" fill="#586575">10k</text>
<polyline points="1600,1170 1600,1178" fill="none" stroke="#586575" stroke-width="3"/>
<polyline points="1588,1220 1612,1220" fill="none" stroke="#586575" stroke-width="2"/>
<polyline points="1592,1226 1608,1226" fill="none" stroke="#586575" stroke-width="2"/>
<polyline points="1597,1232 1603,1232" fill="none" stroke="#586575" stroke-width="2"/>
<text x="1555" y="1238" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#586575">GND_M</text>
<circle cx="1840" cy="1170" r="4" fill="#a65600"/>
<polyline points="1840,1170 1840,1210 1950,1210" fill="none" stroke="#a65600" stroke-width="3"/>
<text x="1970" y="1156" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#a65600">R_EN (3)</text>
<text x="1970" y="1197" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#a65600">L_EN (4)</text>
<text x="65" y="1318" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#a65600">GPIO HIGH → LED ON → EN HIGH. LED OFF / ESP32 без питания → EN LOW.</text>
<text x="65" y="1362" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#172b46">ENABLE не инвертировать. Коллектор - к 5V_M, эмиттер - к двум EN и 10 кОм к GND_M.</text>
<rect x="45" y="1465" width="1140" height="245" fill="#f6f8fc" stroke="#aebed2" stroke-width="2"/>
<text x="65" y="1482" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold" fill="#172b46">Нагрузка и питание</text>
<text x="65" y="1530" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#172b46">На IBT-2: все 4 входные подтяжки ≥10 кОм.</text>
<text x="65" y="1567" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#172b46">При 1 кОм заменить входные резисторы на 10 кОм.</text>
<text x="65" y="1604" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#172b46">R_IS/SR не менять. C у VCC модулей: 100 нФ + 1 мкФ.</text>
<text x="65" y="1641" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#172b46">LED каждого PC817C: измерить IF ≥5 мА при HIGH.</text>
<rect x="1220" y="1465" width="1135" height="245" fill="#f6f8fc" stroke="#aebed2" stroke-width="2"/>
<text x="1240" y="1482" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="26" font-weight="bold" fill="#172b46">Проверка 1 кГц</text>
<text x="1240" y="1530" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#172b46">PC817: фронты до 18 мкс при условиях даташита.</text>
<text x="1240" y="1567" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#172b46">10-битная команда не гарантирует 10-битную точность.</text>
<text x="1240" y="1604" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#172b46">Проверить 1 / 5 / 18 / 50 / 99% и STOP на модуле.</text>
<text x="1240" y="1641" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#172b46">Отдельно измерить EN при потере питания ESP32.</text>
<text x="47" y="1740" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="normal" fill="#586575">GND_CTRL и GND_M не соединять. PC817C не имеет выводов VCC: питание 5V_M поступает в выходную цепь.</text>
<text x="47" y="1770" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="normal" fill="#586575">При включённой инверсии PWM проверьте уровни и отключение ENABLE на входах модулей.</text>
</svg>
