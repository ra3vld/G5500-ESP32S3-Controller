<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
<title>PC817C PWM and ENABLE channel circuits</title>
<rect width="100%" height="100%" fill="white"/>
<text x="45" y="30" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="bold" fill="#172b46">Развязка PC817C: два разных включения каналов</text>
<text x="47" y="82" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="normal" fill="#245fbe">Лист 2. Корпус DIP4, вид сверху: 1 анод, 2 катод, 3 эмиттер, 4 коллектор.</text>
<text x="47" y="126" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" fill="#586575">Все резисторы LED: 200 Ом, 1%; GPIO: 10 кОм к GND_CTRL. Номиналы подтвердить по току и уровням.</text>
<rect x="45" y="195" width="2310" height="590" fill="#f6f8fc" stroke="#aebed2" stroke-width="2"/>
<text x="65" y="213" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="bold" fill="#245fbe">PWM: повторить 4 раза (U1...U4)</text>
