<text x="1445" y="608" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="normal" fill="#586575">GND_M</text>
<text x="65" y="674" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#245fbe">GPIO HIGH → LED ON → выход LOW. GPIO LOW → LED OFF → выход HIGH.</text>
<text x="65" y="718" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#172b46">На GPIO: duty = 1023 − требуемый duty. 0% моста → 100% GPIO; 100% моста → 0% GPIO.</text>
<rect x="45" y="825" width="2310" height="600" fill="#fff8ea" stroke="#aebed2" stroke-width="2"/>
<text x="65" y="843" dominant-baseline="text-before-edge" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="bold" fill="#a65600">ENABLE: повторить 2 раза (U5 / AZ, U6 / EL)</text>
<rect x="940" y="930" width="440" height="330" fill="white" stroke="#aebed2" stroke-width="2"/>
